<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#4f46e5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="/manifest.json" />
  <title>AI 가상 헤어 시뮬레이터</title>
  <script src="https://tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .style-card.active { border-color: #6366f1; background-color: #eef2ff; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center">

  <header class="w-full max-w-md bg-white shadow-sm px-5 py-4 flex items-center justify-between sticky top-0 z-10">
    <h1 class="text-lg font-bold text-indigo-600">💇‍♀️ AI 헤어 시뮬레이터</h1>
    <span class="text-xs bg-green-100 text-green-800 px-2.5 py-1 rounded-full font-medium">🔒 즉시 파기 보안</span>
  </header>

  <main class="w-full max-w-md p-5 flex-1 flex flex-col gap-5">

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <label class="flex items-start gap-2.5 cursor-pointer">
        <input type="checkbox" id="privacyCheck" class="mt-1 w-4 h-4 text-indigo-600 rounded" />
        <span class="text-xs text-gray-600 leading-relaxed">
          <strong class="text-gray-800">[필수] 사진 임시 처리 및 즉시 파기 동의</strong><br />
          업로드한 얼굴 사진은 헤어 합성을 위해 암호화 전송되며, <strong>생성 직후 서버에서 즉시 영구 삭제</strong>됩니다.
        </span>
      </label>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center">
      <div id="previewBox" class="w-full aspect-square bg-gray-100 rounded-xl overflow-hidden flex flex-col items-center justify-center border-2 border-dashed border-gray-300 relative">
        <img id="previewImage" src="" alt="미리보기" class="hidden w-full h-full object-cover" />
        <div id="placeholderText" class="text-center p-4">
          <p class="text-3xl mb-2">🤳</p>
          <p class="text-sm font-medium text-gray-600">정면 셀카 사진을 선택해 주세요</p>
          <p class="text-xs text-gray-400 mt-1">머리카락과 얼굴이 잘 나온 사진이 좋습니다</p>
        </div>
      </div>

      <input type="file" id="photoInput" accept="image/*" class="hidden" />
      <button onclick="document.getElementById('photoInput').click()"
        class="mt-3 w-full py-2.5 px-4 bg-gray-800 hover:bg-gray-900 text-white text-sm font-semibold rounded-xl transition">
        📁 갤러리에서 사진 불러오기
      </button>
    </div>

    <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
      <h2 class="text-sm font-bold text-gray-800 mb-3">✨ 원하는 헤어스타일 선택 (5종)</h2>
      <div class="grid grid-cols-1 gap-2.5" id="styleList">
        <button type="button" data-prompt="sleek chin-length bob haircut, natural dark brown hair, realistic hair texture"
          class="style-card active text-left p-3 border-2 border-gray-200 rounded-xl flex items-center justify-between transition">
          <div>
            <p class="text-sm font-bold text-gray-900">1. 세련된 단발 보브컷</p>
            <p class="text-xs text-gray-500">턱선 기장의 깔끔한 내추럴 다크브라운 단발</p>
          </div>
          <span class="text-lg">✂️</span>
        </button>

        <button type="button" data-prompt="long layered wavy hair with soft curtain bangs, natural chestnut brown color"
          class="style-card text-left p-3 border-2 border-gray-200 rounded-xl flex items-center justify-between transition">
          <div>
            <p class="text-sm font-bold text-gray-900">2. 여신 레이어드 S컬 펌</p>
            <p class="text-xs text-gray-500">자연스러운 시스루 뱅과 풍성한 롱 웨이브</p>
          </div>
          <span class="text-lg">🌊</span>
        </button>

        <button type="button" data-prompt="trendy hippy perm curly voluminous medium hair, soft black hair"
          class="style-card text-left p-3 border-2 border-gray-200 rounded-xl flex items-center justify-between transition">
          <div>
            <p class="text-sm font-bold text-gray-900">3. 발랄한 히피펌 (중단발)</p>
            <p class="text-xs text-gray-500">뿌리부터 탄력 있게 살아나는 컬 스타일</p>
          </div>
          <span class="text-lg">🌀</span>
        </button>

        <button type="button" data-prompt="ash beige blonde dyed straight medium hair, silky smooth texture"
          class="style-card text-left p-3 border-2 border-gray-200 rounded-xl flex items-center justify-between transition">
          <div>
            <p class="text-sm font-bold text-gray-900">4. 애쉬 베이지 탈색 & 염색</p>
            <p class="text-xs text-gray-500">화사한 톤업 애쉬 베이지 컬러 변신</p>
          </div>
          <span class="text-lg">🎨</span>
        </button>

        <button type="button" data-prompt="short pixie cut with soft textured bangs, modern chic style"
          class="style-card text-left p-3 border-2 border-gray-200 rounded-xl flex items-center justify-between transition">
          <div>
            <p class="text-sm font-bold text-gray-900">5. 시크한 숏컷 (픽시컷)</p>
            <p class="text-xs text-gray-500">가볍고 도시적인 느낌의 볼륨 숏컷</p>
          </div>
          <span class="text-lg">⚡</span>
        </button>
      </div>
    </div>

    <button id="generateBtn" onclick="generateHairstyle()"
      class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md transition text-base">
      🪄 AI 헤어스타일 적용하기
    </button>

    <div id="loadingBox" class="hidden bg-indigo-50 border border-indigo-100 rounded-2xl p-5 text-center">
      <div class="animate-spin w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full mx-auto mb-3"></div>
      <p class="text-sm font-bold text-indigo-900">AI가 헤어스타일을 합성하고 있습니다...</p>
      <p class="text-xs text-indigo-600 mt-1">약 5~10초 소요되며, 사진은 서버에 저장되지 않습니다.</p>
    </div>

    <div id="resultBox" class="hidden bg-white p-4 rounded-2xl shadow-md border border-indigo-100 flex flex-col items-center">
      <div class="w-full flex items-center justify-between mb-2">
        <span class="text-sm font-bold text-indigo-600">🎉 합성 완료!</span>
        <span class="text-[11px] text-gray-400">서버 원본 즉시 파기 완료</span>
      </div>
      <img id="resultImage" src="" alt="합성 결과" class="w-full rounded-xl object-cover shadow-sm" />
      <div class="flex gap-2 w-full mt-3">
        <button onclick="downloadResult()"
          class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl transition">
          💾 내 갤러리에 저장
        </button>
        <button onclick="resetAll()"
          class="py-3 px-4 bg-gray-200 hover:bg-gray-300 text-gray-800 text-sm font-semibold rounded-xl transition">
          초기화
        </button>
      </div>
    </div>

  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    let selectedBase64 = "";
    let selectedPrompt = document.querySelector(".style-card.active").dataset.prompt;
    let generatedImageUrl = "";

    document.querySelectorAll(".style-card").forEach(card => {
      card.addEventListener("click", () => {
        document.querySelectorAll(".style-card").forEach(c => c.classList.remove("active"));
        card.classList.add("active");
        selectedPrompt = card.dataset.prompt;
      });
    });

    document.getElementById("photoInput").addEventListener("change", function (e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (event) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement("canvas");
          const maxSize = 1024;
          let width = img.width;
          let height = img.height;

          if (width > height && width > maxSize) {
            height *= maxSize / width;
            width = maxSize;
          } else if (height > maxSize) {
            width *= maxSize / height;
            height = maxSize;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          selectedBase64 = canvas.toDataURL("image/jpeg", 0.9);
          document.getElementById("previewImage").src = selectedBase64;
          document.getElementById("previewImage").classList.remove("hidden");
          document.getElementById("placeholderText").classList.add("hidden");
        };
        img.src = event.target.result;
      };
      reader.readAsDataURL(file);
    });

    async function generateHairstyle() {
      const isAgreed = document.getElementById("privacyCheck").checked;

      if (!isAgreed) {
        alert("개인정보 임시 처리 및 즉시 파기 동의에 체크해 주세요.");
        return;
      }
      if (!selectedBase64) {
        alert("먼저 갤러리에서 얼굴 사진을 선택해 주세요.");
        return;
      }

      const generateBtn = document.getElementById("generateBtn");
      const loadingBox = document.getElementById("loadingBox");
      const resultBox = document.getElementById("resultBox");

      generateBtn.disabled = true;
      generateBtn.classList.add("opacity-50");
      loadingBox.classList.remove("hidden");
      resultBox.classList.add("hidden");

      try {
        const response = await fetch("/api/hair", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            image_url: selectedBase64,
            prompt: selectedPrompt
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || "합성 요청 중 오류가 발생했습니다.");
        }

        generatedImageUrl = data.images[0].url;
        document.getElementById("resultImage").src = generatedImageUrl;
        resultBox.classList.remove("hidden");
      } catch (error) {
        alert("오류 발생: " + error.message);
      } finally {
        generateBtn.disabled = false;
        generateBtn.classList.remove("opacity-50");
        loadingBox.classList.add("hidden");
      }
    }

    async function downloadResult() {
      if (!generatedImageUrl) return;
      try {
        const res = await fetch(generatedImageUrl);
        const blob = await res.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "ai-hairstyle-" + Date.now() + ".jpg";
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (e) {
        window.open(generatedImageUrl, "_blank");
      }
    }

    function resetAll() {
      selectedBase64 = "";
      generatedImageUrl = "";
      document.getElementById("photoInput").value = "";
      document.getElementById("previewImage").src = "";
      document.getElementById("previewImage").classList.add("hidden");
      document.getElementById("placeholderText").classList.remove("hidden");
      document.getElementById("resultBox").classList.add("hidden");
    }
  </script>
</body>
</html>
